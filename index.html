<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Коты из частиц</title>
<style>
html,body{height:100%;margin:0;background:#06040d;overflow:hidden;overscroll-behavior:none}
body{background:radial-gradient(ellipse at 50% 42%,#1d2a3a 0%,#120c26 52%,#06040d 100%)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
.cap{position:fixed;left:0;right:0;bottom:calc(30px + env(safe-area-inset-bottom,0px));text-align:center;color:#fff0d9;font:italic clamp(26px,5vw,40px) "Marck Script",Georgia,serif;text-shadow:0 0 18px #ffa24d;transition:opacity .8s;pointer-events:none}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marck+Script&display=swap">
</head>
<body>
<canvas id="c"></canvas>
<div class="cap" id="cap"></div>
<script>
(()=>{
const c=document.getElementById('c'),ctx=c.getContext('2d'),cap=document.getElementById('cap');
const off=document.createElement('canvas'),o=off.getContext('2d',{willReadFrequently:true});
const W0=640,H0=320,PMAX=7000,TAU=Math.PI*2,rnd=Math.random;
let W,H,dpr=1,PN=PMAX,cur=0,T=0,last=0,t0=0,pend=false,nextSwitch=6;
// ---------- Рисуем котов цветом, потом превращаем пиксели в частицы ----------
const lin=(x0,y0,x1,y1,a,b)=>{const g=o.createLinearGradient(x0,y0,x1,y1);g.addColorStop(0,a);g.addColorStop(1,b);return g};
const el=(x,y,rx,ry,col,rot=0)=>{o.fillStyle=col;o.beginPath();o.ellipse(x,y,rx,ry,rot,0,TAU);o.fill()};
const tri=(a,b,c,col)=>{o.fillStyle=col;o.beginPath();o.moveTo(...a);o.lineTo(...b);o.lineTo(...c);o.fill()};
const ln=(pts,col,w)=>{o.strokeStyle=col;o.lineWidth=w;o.lineCap='round';o.lineJoin='round';o.beginPath();o.moveTo(...pts[0]);for(let i=1;i<pts.length;i++)o.lineTo(...pts[i]);o.stroke()};
const whisk=(cx,cy,col)=>[-1,1].forEach(s=>{for(let j=-1;j<=1;j++)ln([[cx+s*60,cy+48+j*9],[cx+s*128,cy+40+j*20]],col,3)});
function head(p){
 const cx=320,cy=165;
 tri([cx-112,cy-10],[cx-98,cy-125],[cx-30,cy-62],p.ear);tri([cx+112,cy-10],[cx+98,cy-125],[cx+30,cy-62],p.ear);
 tri([cx-98,cy-30],[cx-92,cy-100],[cx-52,cy-62],p.inner);tri([cx+98,cy-30],[cx+92,cy-100],[cx+52,cy-62],p.inner);
 el(cx,cy+20,122,95,p.face);
 if(p.mask)el(cx,cy+42,66,62,p.mask);
 if(p.stripe)[-24,0,24].forEach(d=>ln([[cx+d,cy-70],[cx+d*.8,cy-38]],p.stripe,7));
 if(p.cheek)[-1,1].forEach(s=>ln([[cx+s*95,cy+10],[cx+s*70,cy+22]],p.cheek,6));
 el(cx,cy+58,52,34,p.muzzle);
 [-1,1].forEach(s=>{el(cx+s*46,cy+2,19,24,p.eye);el(cx+s*46,cy+2,5,19,'#120a10');el(cx+s*50,cy-6,4,4,'#fff')});
 tri([cx-11,cy+38],[cx+11,cy+38],[cx,cy+52],p.nose);
 ln([[cx,cy+52],[cx,cy+60]],'#6a3a1c',3);ln([[cx-18,cy+68],[cx-8,cy+72],[cx,cy+60],[cx+8,cy+72],[cx+18,cy+68]],'#6a3a1c',3);
 whisk(cx,cy,'#fff');
}
const orange=()=>head({ear:'#f0a050',inner:'#ff9db8',face:'#f0a050',stripe:'#c46a1c',muzzle:'#fff6d8',eye:'#8ff08f',nose:'#ff6f93'});
const siamese=()=>head({ear:'#6b4a3a',inner:'#a87a6a',face:'#f3e3c8',mask:'#7a5646',muzzle:'#8a6a58',eye:'#6ac8ff',nose:'#3a2a26'});
const grey=()=>head({ear:'#8c95a3',inner:'#ffb3c9',face:'#9aa3b0',stripe:'#555e6b',cheek:'#555e6b',muzzle:'#e6ebf2',eye:'#ffc23a',nose:'#ff8fb1'});
function night(){const cx=300,col='#7a6fa6';
 ln([[cx+70,270],[cx+190,265],[cx+215,170],[cx+175,95]],col,24);
 el(cx,205,78,98,lin(0,100,0,300,'#8b80b8','#4d4575'));
 tri([cx-48,60],[cx-44,-5],[cx-4,35],col);tri([cx+48,60],[cx+44,-5],[cx+4,35],col);
 el(cx,82,56,50,'#8b80b8');
 [-1,1].forEach(s=>{el(cx+s*22,78,12,16,'#ffe14a');el(cx+s*22,78,3.5,13,'#120a10')});
 tri([cx-6,102],[cx+6,102],[cx,110],'#ff9db8');
 [-1,1].forEach(s=>el(cx+s*30,285,26,13,'#6a5f96'));
 whisk(cx-6,40,'#d9d2ff')}
const defs=[orange,siamese,night,grey],caps=['мяу','сиамка','ночной дозор','полосатик'],shapes=[];
function build(){defs.forEach(def=>{
 off.width=W0;off.height=H0;o.clearRect(0,0,W0,H0);def();
 const d=o.getImageData(0,0,W0,H0).data,pts=[];let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
 for(let y=0;y<H0;y+=2)for(let x=0;x<W0;x+=2){const i=(y*W0+x)*4;if(d[i+3]>140){pts.push([x,y,d[i],d[i+1],d[i+2]]);if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}}
 for(let i=pts.length-1;i>0;i--){const j=rnd()*(i+1)|0;[pts[i],pts[j]]=[pts[j],pts[i]]}
 shapes.push({pts,x0,x1,y0,y1});
})}
// ---------- Частицы (2D) ----------
const mk=()=>new Float32Array(PMAX);
const x=mk(),y=mk(),vx=mk(),vy=mk(),tx=mk(),ty=mk(),cr=mk(),cg=mk(),cb=mk(),tr=mk(),tg=mk(),tb=mk(),ph=mk(),
 ntx=mk(),nty=mk(),ntr=mk(),ntg=mk(),ntb=mk(),dl=mk(),dn=new Uint8Array(PMAX);
function setShape(k,burst){
 cur=k;if(burst){t0=T;pend=true}
 const S=shapes[k],s=Math.min(W*.82/(S.x1-S.x0),H*.52/(S.y1-S.y0)),mxp=(S.x0+S.x1)/2,myp=(S.y0+S.y1)/2,n=S.pts.length;
 for(let i=0;i<PN;i++){
  const p=S.pts[n>PN?i:i%n],j=n>PN?0:1.4*dpr;
  ntx[i]=(p[0]-mxp)*s+(rnd()-.5)*j;nty[i]=(p[1]-myp)*s+(rnd()-.5)*j;ntr[i]=p[2];ntg[i]=p[3];ntb[i]=p[4];dn[i]=0;
  if(burst)dl[i]=Math.min(1.1,Math.hypot(x[i],y[i])/(W*.45)); // волна от центра
  else{tx[i]=ntx[i];ty[i]=nty[i];tr[i]=ntr[i];tg[i]=ntg[i];tb[i]=ntb[i];dn[i]=1}
 }
 cap.style.opacity=0;setTimeout(()=>{cap.textContent=caps[cur];cap.style.opacity=1},500);
}
function init(){for(let i=0;i<PMAX;i++){x[i]=(rnd()-.5)*W;y[i]=H*(rnd()-.2);ph[i]=rnd()*TAU;cr[i]=255;cg[i]=190;cb[i]=120}setShape(0,true)}
// ---------- Искры по тапу ----------
let sparks=[];
function burstAt(px,py){const h0=rnd()*40+10;for(let i=0;i<60;i++){const a=rnd()*TAU,f=(1.5+rnd()*5)*dpr;sparks.push({x:px,y:py,vx:Math.cos(a)*f,vy:Math.sin(a)*f,l:1,d:.6+rnd()*.6,h:h0+rnd()*40})}}
// ---------- Цикл ----------
function frame(t){
 requestAnimationFrame(frame);
 const dt=Math.min((t-last)/1000||0,.05);last=t;T+=dt;
 if(T>nextSwitch){setShape((cur+1)%shapes.length,true);nextSwitch=T+6.5}
 if(pend&&T-t0>1.6)pend=false;
 ctx.globalCompositeOperation='destination-out';ctx.fillStyle='rgba(0,0,0,'+(pend?.12:.28)+')';ctx.fillRect(0,0,W,H);
 ctx.globalCompositeOperation='lighter';
 const cxm=W/2,cym=H*.44,kk=.013,damp=.9,sz=2.2*dpr,br=1+.012*Math.sin(T*2);
 for(let i=0;i<PN;i++){
  if(pend&&!dn[i]&&T-t0>=dl[i]){dn[i]=1;tx[i]=ntx[i];ty[i]=nty[i];tr[i]=ntr[i];tg[i]=ntg[i];tb[i]=ntb[i];
   const r=Math.hypot(x[i],y[i])||1,f=(8+rnd()*12)*dpr;vx[i]+=x[i]/r*f;vy[i]+=y[i]/r*f}
  vx[i]=(vx[i]+(tx[i]-x[i])*kk)*damp;vy[i]=(vy[i]+(ty[i]+Math.sin(T*1.4+ph[i])*1.3*dpr-y[i])*kk)*damp;x[i]+=vx[i];y[i]+=vy[i];
  cr[i]+=(tr[i]-cr[i])*.05;cg[i]+=(tg[i]-cg[i])*.05;cb[i]+=(tb[i]-cb[i])*.05;
  const sp=Math.min(1,(Math.abs(vx[i])+Math.abs(vy[i]))*.08),b=(.85+sp*.5)*(.9+.1*Math.sin(T*3+ph[i]*5));
  ctx.fillStyle='rgb('+Math.min(255,cr[i]*b)+','+Math.min(255,cg[i]*b)+','+Math.min(255,cb[i]*b)+')';
  ctx.fillRect(cxm+x[i]*br,cym+y[i]*br,sz,sz);
 }
 for(const s of sparks){s.x+=s.vx;s.y+=s.vy;s.vx*=.98;s.vy=s.vy*.98+.05*dpr;s.l-=dt*s.d;
  ctx.fillStyle='hsla('+s.h+',100%,'+(60+s.l*20)+'%,'+Math.max(0,s.l)+')';ctx.beginPath();ctx.arc(s.x,s.y,(1+s.l*1.6)*dpr,0,TAU);ctx.fill()}
 sparks=sparks.filter(s=>s.l>0);
}
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=c.width=Math.floor(innerWidth*dpr);H=c.height=Math.floor(innerHeight*dpr);PN=innerWidth<700?4800:PMAX;if(shapes.length)setShape(cur,false)}
c.addEventListener('pointerdown',e=>burstAt(e.clientX*dpr,e.clientY*dpr));
addEventListener('keydown',e=>{if(e.key===' '||e.key==='ArrowRight'){setShape((cur+1)%shapes.length,true);nextSwitch=T+6.5}});
addEventListener('resize',resize);
const ready=document.fonts&&document.fonts.load?Promise.race([document.fonts.load('40px "Marck Script"','мяу'),new Promise(r=>setTimeout(r,1200))]):Promise.resolve();
ready.catch(()=>{}).then(()=>{resize();build();init();requestAnimationFrame(frame)});
})();
</script>
</body>
</html>
