<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Для Дянки</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marck+Script&display=swap">
<style>
:root{--bg:#05030c;--ink:#ffe3ee;--mut:#9c88b4;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#05030c}}
:root[data-theme="dark"]{--bg:#05030c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;overscroll-behavior:none}
body{background:radial-gradient(ellipse at 50% 40%,#2a1038 0%,#0f0820 50%,#05030c 100%)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.cap{position:fixed;left:0;right:0;bottom:calc(46px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--ink);font-family:"Marck Script",cursive;font-size:clamp(26px,5vw,40px);text-shadow:0 0 18px #ff6aa8;transition:opacity .8s;pointer-events:none}
.hint{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--mut);font:13px/1.2 system-ui,sans-serif;pointer-events:none}
</style>
</head>
<body>
<canvas id="bg"></canvas><canvas id="fg"></canvas>
<div class="cap" id="cap"></div>
<div class="hint">Тапни: салют · потяни: покрутить</div>
<script>
(()=>{
const bg=document.getElementById('bg'),fg=document.getElementById('fg'),bx=bg.getContext('2d'),fx=fg.getContext('2d'),cap=document.getElementById('cap');
const off=document.createElement('canvas'),o=off.getContext('2d',{willReadFrequently:true});
const W0=640,H0=320,GW=W0/2,GH=H0/2,PMAX=8000,AU=0,TAU=Math.PI*2,rnd=Math.random;
let W,H,dpr=1,PN=PMAX,cur=0,swirl=0,mx=-999,my=-999,mouseOn=false,last=0,T=0,nextAuto=2,nextShoot=1e9,nextSwitch=6,yawD=0,pitD=0,dragging=false;
// ---------- Фигуры: рисуются цветом, потом семплируются ----------
const lin=(x0,y0,x1,y1,a,b)=>{const g=o.createLinearGradient(x0,y0,x1,y1);g.addColorStop(0,a);g.addColorStop(1,b);return g};
const text=(str,a,b,fam='"Marck Script",cursive',s0=150,yc=160,wt='')=>()=>{let s=s0;const f=()=>o.font=wt+' '+s+'px '+fam;f();
 while(o.measureText(str).width>590&&s>40){s-=6;f()}
 o.textAlign='center';o.textBaseline='middle';o.fillStyle=lin(0,yc-70,0,yc+70,a,b);o.fillText(str,320,yc)};
function heart(cx,cy,sc){o.save();o.translate(cx,cy);o.scale(sc,sc);o.fillStyle=lin(-100,-110,100,110,'#ff3d7f','#ffa0bc');o.beginPath();o.moveTo(0,110);
 o.bezierCurveTo(-175,10,-110,-125,0,-45);o.bezierCurveTo(110,-125,175,10,0,110);o.fill();
 o.fillStyle='rgba(255,255,255,.9)';o.beginPath();o.ellipse(-85,-38,22,12,-.7,0,TAU);o.fill();o.restore()}
function flower(){const cx=320,cy=105;
 o.fillStyle='#4cc46a';o.fillRect(cx-5,cy+30,10,170);
 o.beginPath();o.ellipse(cx-42,cy+130,40,14,-.5,0,TAU);o.fill();o.beginPath();o.ellipse(cx+42,cy+95,38,13,.5,0,TAU);o.fill();
 for(let k=0;k<2;k++)for(let i=0;i<8;i++){o.save();o.translate(cx,cy);o.rotate(i*Math.PI/4+k*Math.PI/8);o.fillStyle=(i+k)%2?'#ff7eb6':'#ffb3d1';o.beginPath();o.ellipse(0,-58+k*12,25-k*5,50-k*12,0,0,TAU);o.fill();o.restore()}
 o.fillStyle='#ffd23f';o.beginPath();o.arc(cx,cy,30,0,TAU);o.fill();o.fillStyle='#ff9a1f';o.beginPath();o.arc(cx,cy,14,0,TAU);o.fill()}
function cat(){const cx=320,cy=165;
 const tri=(a,b,c,col)=>{o.fillStyle=col;o.beginPath();o.moveTo(...a);o.lineTo(...b);o.lineTo(...c);o.fill()};
 tri([cx-112,cy-10],[cx-98,cy-125],[cx-30,cy-62],'#f0a050');tri([cx+112,cy-10],[cx+98,cy-125],[cx+30,cy-62],'#f0a050');
 tri([cx-98,cy-30],[cx-92,cy-100],[cx-52,cy-62],'#ff9db8');tri([cx+98,cy-30],[cx+92,cy-100],[cx+52,cy-62],'#ff9db8');
 o.fillStyle='#f0a050';o.beginPath();o.ellipse(cx,cy+20,122,95,0,0,TAU);o.fill();
 o.strokeStyle='#c46a1c';o.lineWidth=7;o.lineCap='round';[-24,0,24].forEach(d=>{o.beginPath();o.moveTo(cx+d,cy-70);o.lineTo(cx+d*.8,cy-40);o.stroke()});
 o.fillStyle='#fff6d8';o.beginPath();o.ellipse(cx,cy+58,52,34,0,0,TAU);o.fill();
 [-1,1].forEach(s=>{o.fillStyle='#8ff08f';o.beginPath();o.ellipse(cx+s*46,cy+2,19,24,0,0,TAU);o.fill();o.fillStyle='#120a10';o.beginPath();o.ellipse(cx+s*46,cy+2,5,19,0,0,TAU);o.fill();
  o.strokeStyle='#fff';o.lineWidth=3;for(let j=-1;j<=1;j++){o.beginPath();o.moveTo(cx+s*60,cy+48+j*9);o.lineTo(cx+s*128,cy+40+j*20);o.stroke()}});
 tri([cx-11,cy+38],[cx+11,cy+38],[cx,cy+52],'#ff6f93');
 o.strokeStyle='#8a4a1c';o.lineWidth=3;o.beginPath();o.moveTo(cx,cy+52);o.lineTo(cx,cy+60);o.moveTo(cx-18,cy+68);o.quadraticCurveTo(cx-8,cy+72,cx,cy+60);o.quadraticCurveTo(cx+8,cy+72,cx+18,cy+68);o.stroke()}
function hug(){text('Обнимяв','#ffe0ec','#ff7eb6','"Marck Script",cursive',150,95)();heart(320,250,.4)}
const defs=[text('Для Дянки','#ffd1e6','#ff5fa2'),()=>heart(320,165,1),flower,cat,hug,text('Ты лучшая','#fff2b0','#ffb347')];
const caps=['с любовью','с тобой всё красивее','тебеее','мяууу','$(@!$!*$','так и есть'];
const shapes=[];
function build(){
 const m=new Uint8Array(GW*GH),d=new Float32Array(GW*GH);
 defs.forEach(def=>{
  off.width=W0;off.height=H0;o.clearRect(0,0,W0,H0);def();
  const data=o.getImageData(0,0,W0,H0).data,pts=[];let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;m.fill(0);
  for(let gy=0;gy<GH;gy++)for(let gx=0;gx<GW;gx++){const i=(gy*2*W0+gx*2)*4;
   if(data[i+3]>140){m[gy*GW+gx]=1;pts.push([gx*2,gy*2,data[i],data[i+1],data[i+2],gy*GW+gx]);if(gx*2<x0)x0=gx*2;if(gx*2>x1)x1=gx*2;if(gy*2<y0)y0=gy*2;if(gy*2>y1)y1=gy*2}}
  // карта расстояния до края: из неё получается «надутый» объём
  for(let i=0;i<m.length;i++)d[i]=m[i]?1e4:0;
  for(let gy=0;gy<GH;gy++)for(let gx=0;gx<GW;gx++){const i=gy*GW+gx;if(!m[i])continue;let v=d[i];
   if(gx>0)v=Math.min(v,d[i-1]+1);if(gy>0){v=Math.min(v,d[i-GW]+1);if(gx>0)v=Math.min(v,d[i-GW-1]+1.41);if(gx<GW-1)v=Math.min(v,d[i-GW+1]+1.41)}d[i]=v}
  for(let gy=GH-1;gy>=0;gy--)for(let gx=GW-1;gx>=0;gx--){const i=gy*GW+gx;if(!m[i])continue;let v=d[i];
   if(gx<GW-1)v=Math.min(v,d[i+1]+1);if(gy<GH-1){v=Math.min(v,d[i+GW]+1);if(gx<GW-1)v=Math.min(v,d[i+GW+1]+1.41);if(gx>0)v=Math.min(v,d[i+GW-1]+1.41)}d[i]=v}
  let dmax=1;for(const p of pts){p[5]=d[p[5]];if(p[5]>dmax)dmax=p[5]}
  for(let i=pts.length-1;i>0;i--){const j=rnd()*(i+1)|0;[pts[i],pts[j]]=[pts[j],pts[i]]}
  shapes.push({pts,x0,x1,y0,y1,dmax});
 });
}
// ---------- Частицы в 3D ----------
const mk=()=>new Float32Array(PMAX);
const x=mk(),y=mk(),z=mk(),vx=mk(),vy=mk(),vz=mk(),tx=mk(),ty=mk(),tz=mk(),cr=mk(),cg=mk(),cb=mk(),tr=mk(),tg=mk(),tb=mk(),ph=mk(),ntx=mk(),nty=mk(),ntz=mk(),ntr=mk(),ntg=mk(),ntb=mk(),dl=mk(),dn=new Uint8Array(PMAX);
let mode=3,t0=0,pend=false;
const aA=new Float32Array(AU),aR=new Float32Array(AU),aS=new Float32Array(AU),aH=new Float32Array(AU);
for(let i=0;i<AU;i++){aA[i]=rnd()*TAU;aR[i]=.55+rnd()*.35;aS[i]=(.15+rnd()*.35)*(rnd()<.5?-1:1);aH[i]=(rnd()-.5)*.9}
function setShape(k,burst){
 cur=k;if(burst){mode=(mode+1)%4;t0=T;pend=true}const S=shapes[k],w=S.x1-S.x0,h=S.y1-S.y0,s=Math.min(W*.82/w,H*.5/h),mxp=(S.x0+S.x1)/2,myp=(S.y0+S.y1)/2,n=S.pts.length,amp=Math.min(.13*w*s,.4*h*s);
 for(let i=0;i<PN;i++){
  const p=S.pts[n>PN?i:i%n],sg=rnd()<.5?-1:1,zz=Math.sqrt(p[5]/S.dmax),tl=sg>0?.72+.4*zz:.45+.25*zz,j=1.4*dpr*(n>PN?0:1);
  ntx[i]=(p[0]-mxp)*s+(rnd()-.5)*j;nty[i]=(p[1]-myp)*s+(rnd()-.5)*j;ntz[i]=sg*zz*amp+(rnd()-.5)*dpr*1.6;
  ntr[i]=p[2]*tl;ntg[i]=p[3]*tl;ntb[i]=p[4]*tl;dn[i]=0;
  if(burst){const r=Math.hypot(x[i],y[i])||1;dl[i]=mode===0?Math.min(1.1,r/(W*.45)):mode===1?(Math.atan2(y[i],x[i])+Math.PI)/TAU:mode===2?rnd()*.7:Math.min(1,Math.max(0,y[i]/H+.5))*.9}else{tx[i]=ntx[i];ty[i]=nty[i];tz[i]=ntz[i];tr[i]=ntr[i];tg[i]=ntg[i];tb[i]=ntb[i];dn[i]=1}
 }
 if(burst)swirl=mode===1?.5:0;
 cap.style.opacity=0;setTimeout(()=>{cap.textContent=caps[cur];cap.style.opacity=1},500);
}
function init(){
 for(let i=0;i<PMAX;i++){x[i]=(rnd()-.5)*W;y[i]=H*(rnd()-.2);z[i]=(rnd()-.5)*W*.5;ph[i]=rnd()*TAU;cr[i]=255;cg[i]=180;cb[i]=220}
 setShape(0,true);
}
// ---------- Камера ----------
let cyw=1,syw=0,cpt=1,spt=0,fd=1,cxm=0,cym=0,PX=0,PY=0,PS=1,pulse=0;
function pj(a,b,c){a*=pulse;b*=pulse;c*=pulse;const X=a*cyw+c*syw,Z=-a*syw+c*cyw,Y=b*cpt-Z*spt,Z2=b*spt+Z*cpt;PS=fd/(fd-Z2);PX=cxm+X*PS;PY=cym+Y*PS}
// ---------- Фон: туманности, звёзды, метеоры ----------
let stars=[],meteors=[];
function mkStars(){stars=Array.from({length:Math.floor(W*H/8000)},()=>({x:rnd()*W,y:rnd()*H,r:(.4+rnd()*1.3)*dpr,p:rnd()*TAU,s:.6+rnd()*2,l:rnd()*3|0}))}
function drawBg(dt,yaw){
 bx.globalCompositeOperation='source-over';bx.clearRect(0,0,W,H);
 bx.globalCompositeOperation='lighter';
 [[.3,.35,'120,40,170',.2],[.72,.55,'255,80,150',.12],[.5,.8,'40,90,210',.14]].forEach((b,i)=>{
  const px=W*(b[0]+.08*Math.sin(T*.1+i*2)),py=H*(b[1]+.05*Math.cos(T*.13+i)),r=Math.max(W,H)*.55,g=bx.createRadialGradient(px,py,0,px,py,r);
  g.addColorStop(0,'rgba('+b[2]+','+b[3]+')');g.addColorStop(1,'rgba('+b[2]+',0)');bx.fillStyle=g;bx.fillRect(0,0,W,H)});
 bx.fillStyle='#fff';
 for(const s of stars){bx.globalAlpha=.3+.7*Math.abs(Math.sin(T*s.s+s.p));bx.fillRect(((s.x+yaw*(s.l+1)*W*.04)%W+W)%W,s.y,s.r,s.r)}
 if(T>nextShoot){meteors.push({x:rnd()*W*.9,y:rnd()*H*.35,vx:(9+rnd()*6)*dpr,vy:(4+rnd()*3)*dpr,l:1});nextShoot=T+4+rnd()*5}
 meteors=meteors.filter(m=>m.l>0);
 for(const m of meteors){m.x+=m.vx;m.y+=m.vy;m.l-=dt*.9;const g=bx.createLinearGradient(m.x,m.y,m.x-m.vx*9,m.y-m.vy*9);
  g.addColorStop(0,'rgba(255,255,255,'+m.l+')');g.addColorStop(1,'rgba(255,255,255,0)');bx.globalAlpha=1;bx.strokeStyle=g;bx.lineWidth=2*dpr;bx.beginPath();bx.moveTo(m.x,m.y);bx.lineTo(m.x-m.vx*9,m.y-m.vy*9);bx.stroke()}
 bx.globalAlpha=1;
}
// ---------- Салют ----------
let rockets=[],sparks=[];
function launch(px,py){rockets.push({x:px,y:H,ty:py,vy:-(14+rnd()*4)*dpr,hue:rnd()*360,heart:rnd()<.5})}
function explode(r){
 const n=r.heart?70:100,v=(r.heart?.28:4.5)*dpr;
 for(let i=0;i<n;i++){let dx,dy;
  if(r.heart){const t=i/n*TAU;dx=16*Math.pow(Math.sin(t),3)*v;dy=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*v}
  else{const a=rnd()*TAU,f=v*(.3+rnd()*.9);dx=Math.cos(a)*f;dy=Math.sin(a)*f}
  sparks.push({x:r.x,y:r.y,vx:dx,vy:dy,l:1,d:.55+rnd()*.5,h:r.heart?340+rnd()*30:r.hue+rnd()*40});}
}
function drawFx(dt){
 for(const r of rockets){r.y+=r.vy;r.vy*=.985;fx.fillStyle='hsl('+r.hue+',100%,75%)';fx.fillRect(r.x,r.y,2.5*dpr,9*dpr);
  if(r.y<=r.ty||r.vy>-2*dpr){r.done=1;explode(r)}}
 rockets=rockets.filter(r=>!r.done);
 for(const s of sparks){s.x+=s.vx;s.y+=s.vy;s.vx*=.985;s.vy=s.vy*.985+.045*dpr;s.l-=dt*s.d;
  fx.fillStyle='hsla('+s.h+',100%,'+(60+s.l*20)+'%,'+Math.max(0,s.l)+')';fx.beginPath();fx.arc(s.x,s.y,(1+s.l*1.6)*dpr,0,TAU);fx.fill()}
 sparks=sparks.filter(s=>s.l>0);
 if(T>nextAuto){launch(W*(.15+rnd()*.7),H*(.12+rnd()*.25));nextAuto=T+3.5+rnd()*3}
}
// ---------- Главный цикл ----------
function frame(t){
 requestAnimationFrame(frame);
 const dt=Math.min((t-last)/1000||0,.05);last=t;T+=dt;
 if(!dragging){yawD*=.96;pitD*=.96}
 if(T>nextSwitch){setShape((cur+1)%shapes.length,true);nextSwitch=T+6.5}
 if(pend&&T-t0>1.6)pend=false;
 const yaw=.5*Math.sin(T*.45)+yawD,pit=.1*Math.sin(T*.37)+.05+pitD;
 cyw=Math.cos(yaw);syw=Math.sin(yaw);cpt=Math.cos(pit);spt=Math.sin(pit);
 const beat=(cur===1||cur===4)?Math.pow(Math.max(0,Math.sin(T*5.5)),6)*.05:0;pulse=1+.015*Math.sin(T*2)+beat;
 
 fx.globalCompositeOperation='destination-out';fx.fillStyle='rgba(0,0,0,'+(pend?.11:.26)+')';fx.fillRect(0,0,W,H);
 fx.globalCompositeOperation='lighter';
 const kk=.013,damp=.9,R2=(90*dpr)**2,base=2.1*dpr;swirl*=.965;
 for(let i=0;i<PN;i++){
  pj(x[i],y[i],z[i]);const sx=PX,sy=PY,ps=PS;
  if(pend&&!dn[i]&&T-t0>=dl[i]){dn[i]=1;tx[i]=ntx[i];ty[i]=nty[i];tz[i]=ntz[i];tr[i]=ntr[i];tg[i]=ntg[i];tb[i]=ntb[i];
   const r=Math.hypot(x[i],y[i])||1,f=(8+rnd()*12)*dpr;
   if(mode===0){vx[i]+=x[i]/r*f;vy[i]+=y[i]/r*f;vz[i]+=(rnd()-.5)*f}
   else if(mode===1){vx[i]-=y[i]/r*f;vy[i]+=x[i]/r*f;vz[i]+=(rnd()-.5)*f*.5}
   else if(mode===2){vy[i]+=f*1.6;vx[i]+=(rnd()-.5)*f*.4}
   else{vz[i]+=(rnd()<.5?-1:1)*f*1.3;vx[i]+=(rnd()-.5)*f}}
  const wob=Math.sin(T*1.4+ph[i])*1.3*dpr;
  let ax=(tx[i]-x[i])*kk,ay=(ty[i]+wob-y[i])*kk,az=(tz[i]-z[i])*kk;
  if(swirl>.02){ax-=z[i]*swirl*.0012;az+=x[i]*swirl*.0012}
  if(mouseOn){const dx=sx-mx,dy=sy-my,d2=dx*dx+dy*dy;if(d2<R2){const f=(1-d2/R2)*2.4*dpr/(Math.sqrt(d2)+1);ax+=dx*f;ay+=dy*f}}
  vx[i]=(vx[i]+ax)*damp;vy[i]=(vy[i]+ay)*damp;vz[i]=(vz[i]+az)*damp;x[i]+=vx[i];y[i]+=vy[i];z[i]+=vz[i];
  cr[i]+=(tr[i]-cr[i])*.05;cg[i]+=(tg[i]-cg[i])*.05;cb[i]+=(tb[i]-cb[i])*.05;
  const sp=Math.min(1,(Math.abs(vx[i])+Math.abs(vy[i]))*.08),b=(.75+sp*.5)*(.9+.1*Math.sin(T*3+ph[i]*5))*(.8+.2*ps);
  fx.fillStyle='rgb('+Math.min(255,cr[i]*b)+','+Math.min(255,cg[i]*b)+','+Math.min(255,cb[i]*b)+')';
  const sz=base*ps;fx.fillRect(sx-sz/2,sy-sz/2,sz,sz);
 }
 // орбитальная пыль вокруг фигуры
 const rr=Math.min(W*.5,H*.7);fx.fillStyle='rgba(255,210,235,.8)';
 for(let i=0;i<AU;i++){const th=aA[i]+T*aS[i],ex=Math.cos(th)*rr*aR[i],ez=Math.sin(th)*rr*aR[i]*.8,ey=aH[i]*rr*.5+Math.sin(th*2+aA[i])*18*dpr+ex*.12;
  pj(ex,ey,ez);const s2=(1+(i%3)*.6)*dpr*PS;fx.globalAlpha=.35+.35*PS*Math.abs(Math.sin(T+i));fx.fillRect(PX,PY,s2,s2)}
 fx.globalAlpha=1;
 drawFx(dt);
}
// ---------- Старт и управление ----------
function resize(){
 dpr=Math.min(devicePixelRatio||1,2);W=bg.width=fg.width=Math.floor(innerWidth*dpr);H=bg.height=fg.height=Math.floor(innerHeight*dpr);
 PN=innerWidth<700?5200:PMAX;fd=H*1.6;cxm=W/2;cym=H*.44;drawBg(0,0);if(shapes.length)setShape(cur,false);
}
let down=null;
fg.addEventListener('pointerdown',e=>{fg.setPointerCapture(e.pointerId);down={x:e.clientX,y:e.clientY,t:performance.now(),moved:0,lx:e.clientX,ly:e.clientY};dragging=true;if(e.pointerType==='touch')mouseOn=false});
fg.addEventListener('pointermove',e=>{
 if(e.pointerType!=='touch'){mx=e.clientX*dpr;my=e.clientY*dpr;mouseOn=!down}
 if(down){down.moved+=Math.abs(e.clientX-down.lx)+Math.abs(e.clientY-down.ly);yawD=Math.max(-1.3,Math.min(1.3,yawD+(e.clientX-down.lx)*.008));pitD=Math.max(-.5,Math.min(.5,pitD+(e.clientY-down.ly)*.005));down.lx=e.clientX;down.ly=e.clientY}});
fg.addEventListener('pointerup',e=>{dragging=false;if(down&&down.moved<10&&performance.now()-down.t<500)launch(e.clientX*dpr,e.clientY*dpr);down=null});
fg.addEventListener('pointercancel',()=>{dragging=false;down=null});
fg.addEventListener('pointerleave',e=>{if(e.pointerType!=='touch')mouseOn=false});
addEventListener('keydown',e=>{if(e.key===' '||e.key==='ArrowRight'){setShape((cur+1)%shapes.length,true);nextSwitch=T+6}});
addEventListener('resize',resize);
const ready=Promise.race([document.fonts.load('100px "Marck Script"','Для Дянки Ты лучшая Обнимяв'),new Promise(r=>setTimeout(r,1800))]);
ready.catch(()=>{}).then(()=>{resize();build();init();requestAnimationFrame(frame)});
})();
</script>
</body>
</html>
