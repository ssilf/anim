<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Для Дянки: ночное небо</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marck+Script&display=swap">
<style>
:root{--bg:#05030c;--ink:#ffe3ee;--mut:#9c88b4;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#05030c}}
:root[data-theme="dark"]{--bg:#05030c}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
body{background:radial-gradient(ellipse at 50% 40%,#2a1038 0%,#0f0820 50%,#05030c 100%)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#fg{cursor:pointer}
.cap{position:fixed;left:0;right:0;bottom:calc(46px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--ink);font-family:"Marck Script",cursive;font-size:clamp(26px,5vw,40px);text-shadow:0 0 18px #ff6aa8;transition:opacity .8s;pointer-events:none}
.hint{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--mut);font:13px/1.2 system-ui,sans-serif;pointer-events:none}
</style>
</head>
<body>
<canvas id="bg"></canvas><canvas id="fg"></canvas>
<div class="cap" id="cap"></div>
<div class="hint">Нажми на небо, и будет салют</div>
<script>
(()=>{
const bg=document.getElementById('bg'),fg=document.getElementById('fg'),bx=bg.getContext('2d'),fx=fg.getContext('2d'),cap=document.getElementById('cap');
const off=document.createElement('canvas'),o=off.getContext('2d',{willReadFrequently:true});
const W0=640,H0=320,P=7000,TAU=Math.PI*2,rnd=Math.random;
let W,H,dpr=1,cur=0,swirl=0,mx=-999,my=-999,mouseOn=false,last=0,T=0,nextAuto=2,nextShoot=3,nextSwitch=5.5;
// ---------- Фигуры (рисуются цветом, потом семплируются) ----------
const lin=(x0,y0,x1,y1,a,b)=>{const g=o.createLinearGradient(x0,y0,x1,y1);g.addColorStop(0,a);g.addColorStop(1,b);return g};
function text(str,a,b){return ()=>{let s=150;o.font=s+'px "Marck Script",cursive';
 while(o.measureText(str).width>590&&s>40){s-=6;o.font=s+'px "Marck Script",cursive'}
 o.textAlign='center';o.textBaseline='middle';o.fillStyle=lin(0,60,0,260,a,b);o.fillText(str,W0/2,H0/2)}}
function heart(){const cx=320,cy=165;o.fillStyle=lin(220,60,420,260,'#ff3d7f','#ffa0bc');o.beginPath();o.moveTo(cx,cy+110);
 o.bezierCurveTo(cx-175,cy+10,cx-110,cy-125,cx,cy-45);o.bezierCurveTo(cx+110,cy-125,cx+175,cy+10,cx,cy+110);o.fill();
 o.fillStyle='rgba(255,255,255,.9)';o.beginPath();o.ellipse(cx-85,cy-38,22,12,-.7,0,TAU);o.fill()}
function flower(){const cx=320,cy=105;
 o.fillStyle='#4cc46a';o.fillRect(cx-5,cy+30,10,170);
 o.beginPath();o.ellipse(cx-42,cy+130,40,14,-.5,0,TAU);o.fill();o.beginPath();o.ellipse(cx+42,cy+95,38,13,.5,0,TAU);o.fill();
 for(let i=0;i<8;i++){o.save();o.translate(cx,cy);o.rotate(i*Math.PI/4);o.fillStyle=i%2?'#ff7eb6':'#ffb3d1';o.beginPath();o.ellipse(0,-58,25,50,0,0,TAU);o.fill();o.restore()}
 o.fillStyle='#ffd23f';o.beginPath();o.arc(cx,cy,30,0,TAU);o.fill();o.fillStyle='#ff9a1f';o.beginPath();o.arc(cx,cy,14,0,TAU);o.fill()}
function cat(){const cx=320,cy=165;
 const tri=(a,b,c,col)=>{o.fillStyle=col;o.beginPath();o.moveTo(...a);o.lineTo(...b);o.lineTo(...c);o.fill()};
 tri([cx-112,cy-10],[cx-98,cy-125],[cx-30,cy-62],'#f0a050');tri([cx+112,cy-10],[cx+98,cy-125],[cx+30,cy-62],'#f0a050');
 tri([cx-98,cy-30],[cx-92,cy-100],[cx-52,cy-62],'#ff9db8');tri([cx+98,cy-30],[cx+92,cy-100],[cx+52,cy-62],'#ff9db8');
 o.fillStyle='#f0a050';o.beginPath();o.ellipse(cx,cy+20,122,95,0,0,TAU);o.fill();
 o.strokeStyle='#c46a1c';o.lineWidth=7;o.lineCap='round';[-24,0,24].forEach(d=>{o.beginPath();o.moveTo(cx+d,cy-70);o.lineTo(cx+d*.8,cy-40);o.stroke()});
 o.fillStyle='#fff6d8';o.beginPath();o.ellipse(cx,cy+58,52,34,0,0,TAU);o.fill();
 [-1,1].forEach(s=>{o.fillStyle='#8ff08f';o.beginPath();o.ellipse(cx+s*46,cy+2,19,24,0,0,TAU);o.fill();o.fillStyle='#120a10';o.beginPath();o.ellipse(cx+s*46,cy+2,5,19,0,0,TAU);o.fill();
  o.strokeStyle='#fff';o.lineWidth=3;for(let j=-1;j<=1;j++){o.beginPath();o.moveTo(cx+s*60,cy+48+j*9);o.lineTo(cx+s*128,cy+40+j*20);o.stroke()}});
 tri([cx-11,cy+38],[cx+11,cy+38],[cx,cy+52],'#ff6f93');
 o.strokeStyle='#8a4a1c';o.lineWidth=3;o.beginPath();o.moveTo(cx,cy+52);o.lineTo(cx,cy+60);o.moveTo(cx-18,cy+68);o.quadraticCurveTo(cx-8,cy+72,cx,cy+60);o.quadraticCurveTo(cx+8,cy+72,cx+18,cy+68);o.stroke()}
function butterfly(){const cx=320,cy=160;
 [-1,1].forEach(s=>{
  o.fillStyle=lin(cx,cy-100,cx+s*150,cy,'#b06bff','#ff6ec7');o.beginPath();o.ellipse(cx+s*85,cy-48,80,56,s*-.5,0,TAU);o.fill();
  o.fillStyle=lin(cx,cy,cx+s*100,cy+100,'#ff9ad5','#6bd5ff');o.beginPath();o.ellipse(cx+s*62,cy+55,52,40,s*.5,0,TAU);o.fill();
  o.fillStyle='rgba(255,255,255,.85)';o.beginPath();o.arc(cx+s*95,cy-55,13,0,TAU);o.fill();o.beginPath();o.arc(cx+s*70,cy+58,8,0,TAU);o.fill();
  o.strokeStyle='#ffe3a8';o.lineWidth=4;o.beginPath();o.moveTo(cx,cy-62);o.quadraticCurveTo(cx+s*30,cy-120,cx+s*50,cy-118);o.stroke()});
 o.fillStyle='#ffe3a8';o.beginPath();o.ellipse(cx,cy,10,72,0,0,TAU);o.fill()}
const defs=[text('Для Дянки','#ffd1e6','#ff5fa2'),heart,flower,cat,butterfly,text('Ты лучшая','#fff2b0','#ffb347')];
const caps=['с любовью','с тобой всё красивее','цветочки тебе','мур-мур','лети выше всех','так и есть'];
const shapes=[];
function build(){defs.forEach(d=>{
 off.width=W0;off.height=H0;o.clearRect(0,0,W0,H0);d();
 const data=o.getImageData(0,0,W0,H0).data,pts=[];let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
 for(let y=0;y<H0;y+=2)for(let x=0;x<W0;x+=2){const i=(y*W0+x)*4;if(data[i+3]>140){pts.push([x,y,data[i],data[i+1],data[i+2]]);if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}}
 for(let i=pts.length-1;i>0;i--){const j=rnd()*(i+1)|0;[pts[i],pts[j]]=[pts[j],pts[i]]}
 shapes.push({pts,x0,x1,y0,y1});})}
// ---------- Частицы ----------
const x=new Float32Array(P),y=new Float32Array(P),vx=new Float32Array(P),vy=new Float32Array(P),tx=new Float32Array(P),ty=new Float32Array(P),
 cr=new Float32Array(P),cg=new Float32Array(P),cb=new Float32Array(P),tr=new Float32Array(P),tg=new Float32Array(P),tb=new Float32Array(P),ph=new Float32Array(P);
function setShape(k,burst){
 cur=k;const S=shapes[k],s=Math.min(W*.82/(S.x1-S.x0),H*.52/(S.y1-S.y0)),mxp=(S.x0+S.x1)/2,myp=(S.y0+S.y1)/2,n=S.pts.length;
 for(let i=0;i<P;i++){const p=S.pts[n>P?i:i%n],j=n>P?0:1.4*dpr;
  tx[i]=W/2+(p[0]-mxp)*s+(rnd()-.5)*j;ty[i]=H*.44+(p[1]-myp)*s+(rnd()-.5)*j;tr[i]=p[2];tg[i]=p[3];tb[i]=p[4];
  if(burst){const a=rnd()*TAU,f=(6+rnd()*16)*dpr;vx[i]+=Math.cos(a)*f;vy[i]+=Math.sin(a)*f}}
 if(burst)swirl=1;
 cap.style.opacity=0;setTimeout(()=>{cap.textContent=caps[k];cap.style.opacity=1},500);
}
function init(){
 for(let i=0;i<P;i++){x[i]=rnd()*W;y[i]=H*(.6+rnd()*.4);ph[i]=rnd()*TAU;cr[i]=255;cg[i]=180;cb[i]=220}
 setShape(0,true);
}
// ---------- Фон, звёзды, метеоры ----------
let stars=[],meteors=[];
function mkStars(){stars=Array.from({length:Math.floor(W*H/9000)},()=>({x:rnd()*W,y:rnd()*H,r:(.4+rnd()*1.2)*dpr,p:rnd()*TAU,s:.6+rnd()*2}))}
function drawBg(dt){
 bx.clearRect(0,0,W,H);
 for(const s of stars){const a=.35+.65*Math.abs(Math.sin(T*s.s+s.p));bx.globalAlpha=a;bx.fillStyle='#fff';bx.fillRect(s.x,s.y,s.r,s.r)}
 if(T>nextShoot){meteors.push({x:rnd()*W*.9,y:rnd()*H*.35,vx:(9+rnd()*6)*dpr,vy:(4+rnd()*3)*dpr,l:1});nextShoot=T+4+rnd()*5}
 meteors=meteors.filter(m=>m.l>0);
 for(const m of meteors){m.x+=m.vx;m.y+=m.vy;m.l-=dt*.9;const g=bx.createLinearGradient(m.x,m.y,m.x-m.vx*9,m.y-m.vy*9);
  g.addColorStop(0,'rgba(255,255,255,'+m.l+')');g.addColorStop(1,'rgba(255,255,255,0)');bx.globalAlpha=1;bx.strokeStyle=g;bx.lineWidth=2*dpr;bx.beginPath();bx.moveTo(m.x,m.y);bx.lineTo(m.x-m.vx*9,m.y-m.vy*9);bx.stroke()}
 bx.globalAlpha=1;
}
// ---------- Салют ----------
let rockets=[],sparks=[];
function launch(px,py){rockets.push({x:px,y:H,ty:py,vy:-(14+rnd()*4)*dpr,hue:rnd()*360,heart:rnd()<.5})}
function explode(r){
 const n=r.heart?70:100,v=(r.heart?.28:4.5)*dpr;
 for(let i=0;i<n;i++){let dx,dy;
  if(r.heart){const t=i/n*TAU;dx=16*Math.pow(Math.sin(t),3);dy=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));dx*=v;dy*=v}
  else{const a=rnd()*TAU,f=v*(.3+rnd()*.9);dx=Math.cos(a)*f;dy=Math.sin(a)*f}
  sparks.push({x:r.x,y:r.y,vx:dx,vy:dy,l:1,d:.55+rnd()*.5,h:r.heart?340+rnd()*30:r.hue+rnd()*40});}
}
function drawFx(dt){
 for(const r of rockets){r.y+=r.vy;r.vy*=.985;fx.fillStyle='hsl('+r.hue+',100%,75%)';fx.fillRect(r.x,r.y,2.5*dpr,9*dpr);
  if(r.y<=r.ty||r.vy>-2*dpr){r.done=1;explode(r)}}
 rockets=rockets.filter(r=>!r.done);
 for(const s of sparks){s.x+=s.vx;s.y+=s.vy;s.vx*=.985;s.vy=s.vy*.985+.045*dpr;s.l-=dt*s.d;
  fx.fillStyle='hsla('+s.h+',100%,'+(60+s.l*20)+'%,'+Math.max(0,s.l)+')';fx.beginPath();fx.arc(s.x,s.y,(1+s.l*1.6)*dpr,0,TAU);fx.fill()}
 sparks=sparks.filter(s=>s.l>0);
 if(T>nextAuto){launch(W*(.15+rnd()*.7),H*(.12+rnd()*.25));nextAuto=T+3.5+rnd()*3}
}
// ---------- Главный цикл ----------
function frame(t){
 requestAnimationFrame(frame);
 const dt=Math.min((t-last)/1000||0,.05);last=t;T+=dt;
 if(T>nextSwitch){setShape((cur+1)%shapes.length,true);nextSwitch=T+5.5}
 drawBg(dt);
 fx.globalCompositeOperation='destination-out';fx.fillStyle='rgba(0,0,0,.24)';fx.fillRect(0,0,W,H);
 fx.globalCompositeOperation='lighter';
 const kk=.013,damp=.9,R2=(90*dpr)**2,sz=2.1*dpr,cxm=W/2,cym=H*.44;swirl*=.965;
 for(let i=0;i<P;i++){
  const wob=Math.sin(T*1.4+ph[i])*1.3*dpr;
  let ax=(tx[i]-x[i])*kk,ay=(ty[i]+wob-y[i])*kk;
  if(swirl>.02){ax-=(y[i]-cym)*swirl*.0012;ay+=(x[i]-cxm)*swirl*.0012}
  if(mouseOn){const dx=x[i]-mx,dy=y[i]-my,d2=dx*dx+dy*dy;if(d2<R2){const f=(1-d2/R2)*2.4*dpr/(Math.sqrt(d2)+1);ax+=dx*f;ay+=dy*f}}
  vx[i]=(vx[i]+ax)*damp;vy[i]=(vy[i]+ay)*damp;x[i]+=vx[i];y[i]+=vy[i];
  cr[i]+=(tr[i]-cr[i])*.05;cg[i]+=(tg[i]-cg[i])*.05;cb[i]+=(tb[i]-cb[i])*.05;
  const sp=Math.min(1,(Math.abs(vx[i])+Math.abs(vy[i]))*.08),b=.72+sp*.5;
  fx.fillStyle='rgb('+Math.min(255,cr[i]*b)+','+Math.min(255,cg[i]*b)+','+Math.min(255,cb[i]*b)+')';
  fx.fillRect(x[i],y[i],sz,sz);
 }
 drawFx(dt);
}
// ---------- Старт ----------
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=bg.width=fg.width=Math.floor(innerWidth*dpr);H=bg.height=fg.height=Math.floor(innerHeight*dpr);mkStars();if(shapes.length)setShape(cur,false)}
fg.addEventListener('pointermove',e=>{mx=e.clientX*dpr;my=e.clientY*dpr;mouseOn=true});
fg.addEventListener('pointerleave',()=>{mouseOn=false});
fg.addEventListener('pointerdown',e=>{mx=e.clientX*dpr;my=e.clientY*dpr;launch(mx,my);if(e.pointerType==='touch')mouseOn=false});
addEventListener('keydown',e=>{if(e.key===' '||e.key==='ArrowRight'){setShape((cur+1)%shapes.length,true);nextSwitch=T+5.5}});
addEventListener('resize',resize);
const ready=Promise.race([document.fonts.load('100px "Marck Script"','Для Дянки Ты лучшая'),new Promise(r=>setTimeout(r,1500))]);
ready.catch(()=>{}).then(()=>{resize();build();init();requestAnimationFrame(frame)});
})();
</script>
</body>
</html>
